[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datakit"
version = "0.1.0"
description = "Data management, operations and analysis for tabular data — library and CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "SQLAlchemy>=2.0",
    "requests>=2.28",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
datakit = "datakit.cli:main"

[tool.setuptools.packages.find]
include = ["datakit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
